<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url('https://codepen.io/GreenSock/pen/xxmzBrw/fcaef74061bb7a76e5263dfc076c363e.css');

    /* Global styles come from external css https://codepen.io/GreenSock/pen/xxmzBrw/fcaef74061bb7a76e5263dfc076c363e.css
 */
    body {
      display: flex;
      align-items: center;
      justify-content: space-around;
      min-height: 100vh;
      flex-direction: column;
    }
  </style>
</head>

<body>
  <h1>안녕 클레오파트라</h1>
  <div class="box gradient-green green"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>
    gsap.to('h1', { duration: 2, fontSize: "100px" })
    const a = gsap.to('.box', { duration: 2, scale: 3, rotate: 750, paused: true })
    // 자바스크립트의 이벤트핸들링
    document.querySelector('h1').addEventListener('click', function (e) {
      //console.log(e);
      a.play()
      // this.style.marginLeft = e.clientX + "px"
    })
  </script>
</body>

</html>
