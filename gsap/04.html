<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://codepen.io/GreenSock/pen/xxmzBrw/fcaef74061bb7a76e5263dfc076c363e.css");

      /* Global styles come from external css https://codepen.io/GreenSock/pen/xxmzBrw/fcaef74061bb7a76e5263dfc076c363e.css
 */
      body {
        display: flex;
        align-items: center;
        justify-content: space-around;
        min-height: 100vh;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <div class="box green"></div>
    <button id="play">play</button>
    <button id="pause">pause</button>
    <button id="resume">resume</button>
    <button id="reverse">reverse</button>
    <button id="restart">restart</button>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
      const box = gsap.to(".green", { duration: 8, x: 400, width: 400, paused: true });

      const actions = {
        play() {
          box.play();
        },
        pause() {
          box.pause();
        },
        resume() {
          box.resume();
        },
        reverse() {
          box.reverse();
        },
        restart() {
          box.restart();
        },
      };

      document.querySelectorAll("button").forEach((button) => {
        const fn = actions[button.id];
        if (fn) {
          button.addEventListener("click", fn);
        }
      });
    </script>
  </body>
</html>
