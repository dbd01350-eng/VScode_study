<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        background: pink;
      }

      section {
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <section></section>
    <section>
      <div class="box"></div>
    </section>
    <section></section>
    <section></section>
    <section></section>
    <section></section>
    <section></section>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother requires ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollToPlugin.min.js"></script>
    <script>
      // section 별 배경색 변경
      const bg = document.querySelectorAll("section");
      const colors = { r: 255, g: 255, b: 255 };

      bg.forEach(function (a, b) {
        a.style.background = `rgb(${colors.r - b * 100},${colors.g - b * 50},${colors.b - b * 10})`;
      });

      gsap.to(".box", {
        scrollTrigger: ".box",
        x: "50vw",
        y: "-500px",
      });                                                                                                                                                              
    </script>
  </body>
</html>
