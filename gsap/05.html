<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://codepen.io/GreenSock/pen/xxmzBrw/fcaef74061bb7a76e5263dfc076c363e.css");

      /* Global styles come from external css https://codepen.io/GreenSock/pen/xxmzBrw/fcaef74061bb7a76e5263dfc076c363e.css
 */
      body {
        display: flex;
        align-items: center;
        justify-content: space-around;
        min-height: 100vh;
        flex-direction: column;
      }
    </style>
  </head>

  <body>
    <div class="box green"></div>
    <div class="box red"></div>
    <div class="box blue"></div>
    <div class="box yellow"></div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script>
      let time = gsap.timeline({ duration: 1 });
      time.from(".green", { x: -500 }).from(".red", { x: -500 }).from(".blue", { x: -500 });
    </script>
  </body>
</html>
